<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Tournament Manager</title>
<!-- ===== EXTERNAL CSS (standalone file) ===== -->
<link rel="stylesheet" href="style.css">
<!-- =========================================== -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>

<header>
  <h1>Tournament <span>Manager</span></h1>
  <div class="header-actions">
    <button id="pool-toggle" class="burger-btn">☰ Roster</button>
    <button id="btn-add-round" class="primary">+ Round</button>
    <button id="btn-export-diagram">Export Diagram</button>
    <button id="btn-export">Export JSON</button>
    <button id="btn-import">Import JSON</button>
    <button id="btn-export-csv">Export CSV</button>
    <button id="btn-import-csv">Import CSV</button>
    <button id="btn-export-template">Template CSV</button>
    <input type="file" id="file-input" accept="application/json">
    <input type="file" id="csv-input" accept=".csv,text/csv">
  </div>
</header>

<div class="layout">
  <div id="pool-backdrop"></div>
  <div id="pool-panel">
    <div class="panel-head"><h2>Roster</h2><button id="pool-close" class="small" style="display:none;">Close</button></div>
    <div id="create-form">
      <input id="f-name" placeholder="First name *">
      <input id="f-surname" placeholder="Last name">
      <div class="form-row">
        <input id="f-gender" placeholder="Gender">
        <input id="f-age" placeholder="Age" type="number" min="0">
      </div>
      <textarea id="f-notes" placeholder="Notes (backstory, stats, anything extra)"></textarea>
      <button id="btn-create" class="primary">Add character</button>
    </div>
    <div id="pool-list"></div>
  </div>

  <div id="board-wrapper">
    <div class="view-tabs">
      <button id="tab-rounds" class="active">Rounds</button>
      <button id="tab-teams">Teams</button>
    </div>
    <div id="board">
      <div id="board-inner"></div>
    </div>
  </div>
</div>

<div id="modal-backdrop">
  <div class="modal">
    <h3>Character details</h3>
    <label>First name *</label>
    <input id="m-name">
    <label>Last name</label>
    <input id="m-surname">
    <label>Gender</label>
    <input id="m-gender">
    <label>Age</label>
    <input id="m-age" type="number" min="0">
    <label>Notes</label>
    <textarea id="m-notes"></textarea>
    <div id="m-elim-history" class="elim-history-box"></div>
    <div class="modal-actions">
      <button id="m-delete" class="danger">Delete</button>
      <div class="modal-actions-right">
        <button id="m-cancel">Cancel</button>
        <button id="m-save" class="primary">Save</button>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";

  const STORAGE_KEY = "tournament-manager-state-v2";
  let state = { characters:{}, rounds:[] };
  let editingCharId = null;
  let currentView = 'rounds';

  function uid(prefix){ return prefix + "_" + Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4); }

  function defaultState(){
    return { characters:{}, rounds:[ {id:uid("round"), name:"Round 1", collapsed:false, slots:[
      {id:uid("slot"), name:"", collapsed:false, characterIds:[]},
      {id:uid("slot"), name:"", collapsed:false, characterIds:[]}
    ]} ] };
  }

  function migrateCharacter(c){
    return {
      id:c.id,
      firstName: c.firstName !== undefined ? c.firstName : (c.name || "Unnamed"),
      lastName: c.lastName !== undefined ? c.lastName : (c.surname || ""),
      gender: c.gender || "",
      age: c.age !== undefined ? c.age : "",
      notes: c.notes || "",
      eliminatedInRounds: c.eliminatedInRounds || {}
    };
  }

  function migrateState(raw){
    const out = { characters:{}, rounds: raw.rounds || [] };
    Object.keys(raw.characters || {}).forEach(id=>{
      out.characters[id] = migrateCharacter(raw.characters[id]);
    });
    out.rounds.forEach(r=>{
      if(r.collapsed === undefined) r.collapsed = false;
      (r.slots||[]).forEach(s=>{ if(s.collapsed === undefined) s.collapsed = false; });
    });
    return out;
  }

  function saveLocal(){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){ console.warn("localStorage save failed", e); }
  }
  function loadLocal(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      if(raw){ state = migrateState(JSON.parse(raw)); return true; }
    }catch(e){ console.warn("localStorage load failed", e); }
    return false;
  }

  function fullName(c){ return c.lastName ? `${c.firstName} ${c.lastName}` : c.firstName; }

  /* ============ Drag & Drop ============ */
  let drag = null;

  function attachDraggable(el, payload){
    el.addEventListener("pointerdown", (e)=>{
      if(e.target.closest("button") || e.target.closest(".card-name") || e.target.closest("input")) return;
      if(drag) return;
      drag = { pointerId:e.pointerId, payload, sourceEl:el, startX:e.clientX, startY:e.clientY, active:false, ghost:null, lastTarget:null };
      el.setPointerCapture(e.pointerId);
    });

    el.addEventListener("pointermove", (e)=>{
      if(!drag || drag.pointerId !== e.pointerId || drag.sourceEl !== el) return;
      const dx = e.clientX - drag.startX, dy = e.clientY - drag.startY;
      if(!drag.active){
        if(Math.hypot(dx,dy) < 6) return;
        drag.active = true;
        el.classList.add("dragging-source");
        const rect = el.getBoundingClientRect();
        const ghost = el.cloneNode(true);
        ghost.className = "card drag-ghost";
        ghost.style.width = rect.width + "px";
        ghost.style.left = rect.left + "px";
        ghost.style.top = rect.top + "px";
        document.body.appendChild(ghost);
        drag.ghost = ghost;
        drag.offsetX = drag.startX - rect.left;
        drag.offsetY = drag.startY - rect.top;
      }
      e.preventDefault();
      drag.ghost.style.left = (e.clientX - drag.offsetX) + "px";
      drag.ghost.style.top = (e.clientY - drag.offsetY) + "px";
      drag.ghost.style.display = "none";
      const under = document.elementFromPoint(e.clientX, e.clientY);
      drag.ghost.style.display = "";
      const slotTarget = under && (under.closest(".slot") || under.closest(".team-card"));
      const poolTarget = under && under.closest("#pool-panel");
      if(drag.lastTarget && drag.lastTarget !== slotTarget) drag.lastTarget.classList.remove("dragover");
      if(slotTarget){ slotTarget.classList.add("dragover"); drag.lastTarget = slotTarget; }
      else { drag.lastTarget = null; }
      drag.overPool = !!poolTarget && !slotTarget;
    });

    function finish(e){
      if(!drag || drag.pointerId !== e.pointerId || drag.sourceEl !== el) return;
      if(drag.active){
        if(drag.lastTarget){
          let roundId, slotId;
          if(drag.lastTarget.classList.contains("slot")){
            roundId = drag.lastTarget.dataset.roundId;
            slotId = drag.lastTarget.dataset.slotId;
          } else if(drag.lastTarget.classList.contains("team-card")){
            roundId = drag.lastTarget.dataset.roundId;
            slotId = drag.lastTarget.dataset.slotId;
          }
          if(roundId && slotId){
            if(drag.payload.from === "slot"){
              if(!(drag.payload.roundId===roundId && drag.payload.slotId===slotId)){
                removeFromSlot(drag.payload.roundId, drag.payload.slotId, drag.payload.charId);
              }
            }
            addToSlot(roundId, slotId, drag.payload.charId);
            saveLocal(); render();
          }
        } else if(drag.overPool && drag.payload.from === "slot"){
          removeFromSlot(drag.payload.roundId, drag.payload.slotId, drag.payload.charId);
          saveLocal(); render();
        }
        if(drag.ghost) drag.ghost.remove();
        if(drag.lastTarget) drag.lastTarget.classList.remove("dragover");
        el.classList.remove("dragging-source");
      }
      try{ el.releasePointerCapture(drag.pointerId); }catch(err){}
      drag = null;
    }
    el.addEventListener("pointerup", finish);
    el.addEventListener("pointercancel", finish);
  }

  /* ============ Card rendering (compact: name + actions inline) ============ */
  function renderCard(charId, ctx){
    const c = state.characters[charId];
    if(!c) return document.createComment("missing char");
    const eliminatedHere = ctx.location === "slot" && !!c.eliminatedInRounds[ctx.roundId];
    const el = document.createElement("div");
    el.className = "card" + (eliminatedHere ? " eliminated" : "");
    el.dataset.charId = charId;

    const payload = ctx.location === "pool"
      ? { charId, from:"pool" }
      : { charId, from:"slot", roundId:ctx.roundId, slotId:ctx.slotId };
    attachDraggable(el, payload);

    // Flex row: name + actions inline
    const row = document.createElement("div");
    row.style.display = "flex";
    row.style.alignItems = "center";
    row.style.gap = "6px";
    row.style.flexWrap = "wrap";

    const name = document.createElement("span");
    name.className = "card-name";
    name.textContent = c.firstName;
    name.style.flex = "1";
    name.style.minWidth = "60px";
    name.title = "Click to view/edit details";
    name.addEventListener("click", ()=>openModal(charId));
    row.appendChild(name);

    const actions = document.createElement("div");
    actions.style.display = "flex";
    actions.style.gap = "4px";
    actions.style.flexShrink = "0";

    if(ctx.location === "slot"){
      const elimBtn = document.createElement("button");
      elimBtn.className = "small" + (eliminatedHere ? "" : " danger");
      elimBtn.textContent = eliminatedHere ? "Restore" : "Elim";
      elimBtn.style.fontSize = ".6rem";
      elimBtn.style.padding = "2px 5px";
      elimBtn.addEventListener("click", (e)=>{
        e.stopPropagation();
        if(eliminatedHere){ delete c.eliminatedInRounds[ctx.roundId]; }
        else { c.eliminatedInRounds[ctx.roundId] = ctx.roundName; }
        saveLocal(); render();
      });
      actions.appendChild(elimBtn);

      const removeBtn = document.createElement("button");
      removeBtn.className = "small";
      removeBtn.textContent = "Bench";
      removeBtn.style.fontSize = ".6rem";
      removeBtn.style.padding = "2px 5px";
      removeBtn.title = "Remove from this slot, return to roster";
      removeBtn.addEventListener("click", (e)=>{
        e.stopPropagation();
        removeFromSlot(ctx.roundId, ctx.slotId, charId);
        saveLocal(); render();
      });
      actions.appendChild(removeBtn);
    } else {
      const editBtn = document.createElement("button");
      editBtn.className = "small";
      editBtn.textContent = "✎";
      editBtn.style.fontSize = ".65rem";
      editBtn.style.padding = "2px 6px";
      editBtn.addEventListener("click", (e)=>{
        e.stopPropagation();
        openModal(charId);
      });
      actions.appendChild(editBtn);

      const delBtn = document.createElement("button");
      delBtn.className = "small danger";
      delBtn.textContent = "✕";
      delBtn.style.fontSize = ".6rem";
      delBtn.style.padding = "2px 5px";
      delBtn.addEventListener("click", (e)=>{
        e.stopPropagation();
        if(confirm(`Delete ${fullName(c)} permanently?`)){
          deleteCharacter(charId);
          saveLocal(); render();
        }
      });
      actions.appendChild(delBtn);
    }

    row.appendChild(actions);
    el.appendChild(row);

    if(ctx.location === "slot" && eliminatedHere){
      const badge = document.createElement("div");
      badge.className = "card-elim-badge";
      badge.textContent = "Eliminated";
      badge.style.fontSize = ".5rem";
      badge.style.padding = "1px 4px";
      badge.style.marginTop = "2px";
      el.appendChild(badge);
    } else if(ctx.location === "pool"){
      const historyRounds = Object.values(c.eliminatedInRounds || {});
      if(historyRounds.length){
        const badge = document.createElement("div");
        badge.className = "card-elim-badge";
        badge.title = historyRounds.join(", ");
        badge.textContent = "Elim: " + historyRounds.join(", ");
        badge.style.fontSize = ".5rem";
        badge.style.padding = "1px 4px";
        badge.style.marginTop = "2px";
        el.appendChild(badge);
      }
    }

    return el;
  }

  /* ============ Modal ============ */
  function openModal(charId){
    const c = state.characters[charId];
    if(!c) return;
    editingCharId = charId;
    document.getElementById("m-name").value = c.firstName || "";
    document.getElementById("m-surname").value = c.lastName || "";
    document.getElementById("m-gender").value = c.gender || "";
    document.getElementById("m-age").value = c.age === "" ? "" : c.age;
    document.getElementById("m-notes").value = c.notes || "";
    const historyBox = document.getElementById("m-elim-history");
    const rounds = Object.values(c.eliminatedInRounds || {});
    if(rounds.length){
      historyBox.classList.remove("none");
      historyBox.textContent = "Eliminated in: " + rounds.join(", ");
    } else {
      historyBox.classList.add("none");
      historyBox.textContent = "No elimination history.";
    }
    document.getElementById("modal-backdrop").classList.add("open");
  }
  function closeModal(){
    document.getElementById("modal-backdrop").classList.remove("open");
    editingCharId = null;
  }
  document.getElementById("m-cancel").addEventListener("click", closeModal);
  document.getElementById("modal-backdrop").addEventListener("click", (e)=>{ if(e.target.id==="modal-backdrop") closeModal(); });
  document.getElementById("m-save").addEventListener("click", ()=>{
    if(!editingCharId) return;
    const c = state.characters[editingCharId];
    if(!c) return;
    const name = document.getElementById("m-name").value.trim();
    if(!name){ alert("First name is required."); return; }
    c.firstName = name;
    c.lastName = document.getElementById("m-surname").value.trim();
    c.gender = document.getElementById("m-gender").value.trim();
    const ageRaw = document.getElementById("m-age").value.trim();
    c.age = ageRaw === "" ? "" : Number(ageRaw);
    c.notes = document.getElementById("m-notes").value;
    saveLocal(); closeModal(); render();
  });
  document.getElementById("m-delete").addEventListener("click", ()=>{
    if(!editingCharId) return;
    const c = state.characters[editingCharId];
    if(!c) return;
    if(confirm(`Delete ${fullName(c)} permanently? This removes them from all rounds.`)){
      deleteCharacter(editingCharId);
      saveLocal(); closeModal(); render();
    }
  });

  /* ============ Mutations ============ */
  function createCharacter(data){
    const id = uid("char");
    state.characters[id] = {
      id, firstName:data.firstName, lastName:data.lastName||"", gender:data.gender||"",
      age:data.age===undefined?"":data.age, notes:data.notes||"", eliminatedInRounds:{}
    };
    return id;
  }
  function deleteCharacter(charId){
    delete state.characters[charId];
    state.rounds.forEach(r=>r.slots.forEach(s=>{ s.characterIds = s.characterIds.filter(id=>id!==charId); }));
  }
  function removeFromSlot(roundId, slotId, charId){
    const round = state.rounds.find(r=>r.id===roundId); if(!round) return;
    const slot = round.slots.find(s=>s.id===slotId); if(!slot) return;
    slot.characterIds = slot.characterIds.filter(id=>id!==charId);
  }
  function addToSlot(roundId, slotId, charId){
    const round = state.rounds.find(r=>r.id===roundId); if(!round) return;
    const slot = round.slots.find(s=>s.id===slotId); if(!slot) return;
    if(!slot.characterIds.includes(charId)) slot.characterIds.push(charId);
  }
  function addRound(){
    state.rounds.push({ id:uid("round"), name:`Round ${state.rounds.length+1}`, collapsed:false, slots:[
      {id:uid("slot"), name:"", collapsed:false, characterIds:[]},
      {id:uid("slot"), name:"", collapsed:false, characterIds:[]}
    ]});
    saveLocal(); render();
  }
  function removeRound(roundId){
    const round = state.rounds.find(r=>r.id===roundId); if(!round) return;
    if(!confirm(`Remove "${round.name}"? Characters return to the roster.`)) return;
    state.rounds = state.rounds.filter(r=>r.id!==roundId);
    saveLocal(); render();
  }
  function addSlot(roundId){
    const round = state.rounds.find(r=>r.id===roundId); if(!round) return;
    round.slots.push({ id:uid("slot"), name:"", collapsed:false, characterIds:[] });
    saveLocal(); render();
  }
  function removeSlot(roundId, slotId){
    const round = state.rounds.find(r=>r.id===roundId); if(!round) return;
    if(round.slots.length<=1){ alert("A round needs at least one slot."); return; }
    if(!confirm("Remove this slot? Its characters return to the roster.")) return;
    round.slots = round.slots.filter(s=>s.id!==slotId);
    saveLocal(); render();
  }

  /* ============ Rendering ============ */
  function render(){
    renderPool();
    if(currentView === 'rounds') renderRoundsView();
    else renderTeamsView();
  }

  function renderPool(){
    const list = document.getElementById("pool-list");
    list.innerHTML = "";
    const ids = Object.keys(state.characters).sort((a,b)=>{
      const ca=state.characters[a], cb=state.characters[b];
      return ca.firstName.localeCompare(cb.firstName, undefined, {sensitivity:"base"})
        || (ca.lastName||"").localeCompare(cb.lastName||"", undefined, {sensitivity:"base"});
    });
    if(ids.length===0){
      const hint = document.createElement("div");
      hint.className = "empty-hint";
      hint.textContent = "No characters yet. Add one above, then drag them into a round's team slots.";
      list.appendChild(hint);
      return;
    }
    ids.forEach(id=>{ list.appendChild(renderCard(id, {location:"pool"})); });
  }

  function renderRoundsView(){
    const board = document.getElementById("board-inner");
    board.className = '';
    board.innerHTML = '';

    state.rounds.forEach((round, idx)=>{
      const col = document.createElement("div");
      col.className = "round-col" + (round.collapsed ? " collapsed" : "");

      const head = document.createElement("div");
      head.className = "round-head";

      const main = document.createElement("div");
      main.className = "round-head-main";
      const collapseBtn = document.createElement("button");
      collapseBtn.className = "small icon";
      collapseBtn.textContent = round.collapsed ? "▸" : "▾";
      collapseBtn.title = round.collapsed ? "Expand round" : "Collapse round";
      collapseBtn.addEventListener("click", ()=>{ round.collapsed = !round.collapsed; saveLocal(); render(); });
      const numTag = document.createElement("span");
      numTag.className = "round-num";
      numTag.textContent = String(idx+1).padStart(2,"0");
      const nameInput = document.createElement("input");
      nameInput.className = "round-name";
      nameInput.value = round.name;
      nameInput.addEventListener("change", ()=>{ round.name = nameInput.value || `Round ${idx+1}`; saveLocal(); render(); });
      main.appendChild(collapseBtn);
      main.appendChild(numTag);
      main.appendChild(nameInput);

      const rmBtn = document.createElement("button");
      rmBtn.className = "small danger";
      rmBtn.textContent = "✕";
      rmBtn.title = "Remove round";
      rmBtn.addEventListener("click", ()=>removeRound(round.id));

      head.appendChild(main);
      head.appendChild(rmBtn);
      col.appendChild(head);

      const body = document.createElement("div");
      body.className = "round-body";
      round.slots.forEach(slot=>{ body.appendChild(renderSlot(round, slot)); });
      col.appendChild(body);

      const addSlotBtn = document.createElement("button");
      addSlotBtn.className = "add-slot-btn";
      addSlotBtn.textContent = "+ Team slot";
      addSlotBtn.addEventListener("click", ()=>addSlot(round.id));
      col.appendChild(addSlotBtn);

      board.appendChild(col);
    });

    const addCol = document.createElement("div");
    addCol.className = "round-col";
    addCol.style.display = "flex";
    addCol.style.alignItems = "center";
    addCol.style.justifyContent = "center";
    addCol.style.background = "transparent";
    addCol.style.border = "1px dashed var(--border)";
    const addColBtn = document.createElement("button");
    addColBtn.className = "primary";
    addColBtn.textContent = "+ Add round";
    addColBtn.addEventListener("click", addRound);
    addCol.appendChild(addColBtn);
    board.appendChild(addCol);
  }

  function renderSlot(round, slot){
    const el = document.createElement("div");
    el.className = "slot" + (slot.collapsed ? " collapsed" : "");
    el.dataset.roundId = round.id;
    el.dataset.slotId = slot.id;

    const head = document.createElement("div");
    head.className = "slot-head";
    const collapseBtn = document.createElement("button");
    collapseBtn.className = "small icon";
    collapseBtn.textContent = slot.collapsed ? "▸" : "▾";
    collapseBtn.title = slot.collapsed ? "Expand team" : "Collapse team";
    collapseBtn.addEventListener("click", ()=>{ slot.collapsed = !slot.collapsed; saveLocal(); render(); });
    const nameInput = document.createElement("input");
    nameInput.className = "slot-name";
    nameInput.placeholder = "Team name (optional)";
    nameInput.value = slot.name;
    nameInput.addEventListener("change", ()=>{ slot.name = nameInput.value; saveLocal(); });
    const count = document.createElement("span");
    count.className = "slot-count";
    count.textContent = slot.characterIds.length;
    const rmBtn = document.createElement("button");
    rmBtn.className = "small";
    rmBtn.textContent = "✕";
    rmBtn.title = "Remove slot";
    rmBtn.addEventListener("click", ()=>removeSlot(round.id, slot.id));
    head.appendChild(collapseBtn);
    head.appendChild(nameInput);
    head.appendChild(count);
    head.appendChild(rmBtn);
    el.appendChild(head);

    const cardsWrap = document.createElement("div");
    cardsWrap.className = "slot-cards";
    if(slot.characterIds.length===0){
      const empty = document.createElement("div");
      empty.className = "slot-empty";
      empty.textContent = "Drop characters here";
      cardsWrap.appendChild(empty);
    } else {
      slot.characterIds.forEach(charId=>{
        cardsWrap.appendChild(renderCard(charId, {location:"slot", roundId:round.id, slotId:slot.id, roundName:round.name}));
      });
    }
    el.appendChild(cardsWrap);
    return el;
  }

  /* ============ Teams View (independent teams per round) ============ */
  function renderTeamsView(){
    const board = document.getElementById("board-inner");
    board.className = 'teams-view';
    board.innerHTML = '';

    if(state.rounds.length === 0){
      const empty = document.createElement("div");
      empty.style.gridColumn = "1/-1";
      empty.style.color = "var(--text-dim)";
      empty.style.padding = "40px";
      empty.style.textAlign = "center";
      empty.textContent = "No rounds yet. Add a round to see teams.";
      board.appendChild(empty);
      return;
    }

    state.rounds.forEach(round => {
      round.slots.forEach(slot => {
        const card = document.createElement("div");
        card.className = "team-card";
        card.dataset.roundId = round.id;
        card.dataset.slotId = slot.id;

        const nameDiv = document.createElement("div");
        nameDiv.className = "team-name";
        const nameInput = document.createElement("input");
        nameInput.type = "text";
        nameInput.value = slot.name || "Unnamed team";
        nameInput.placeholder = "Team name";
        nameInput.addEventListener("change", ()=>{
          slot.name = nameInput.value;
          saveLocal();
        });
        nameDiv.appendChild(nameInput);
        const rmSlotBtn = document.createElement("button");
        rmSlotBtn.className = "small danger";
        rmSlotBtn.textContent = "✕";
        rmSlotBtn.title = "Remove slot";
        rmSlotBtn.addEventListener("click", ()=>removeSlot(round.id, slot.id));
        nameDiv.appendChild(rmSlotBtn);
        card.appendChild(nameDiv);

        const roundDiv = document.createElement("div");
        roundDiv.className = "team-round";
        roundDiv.textContent = round.name;
        card.appendChild(roundDiv);

        const members = document.createElement("div");
        members.className = "team-members";
        if(slot.characterIds.length === 0){
          const empty = document.createElement("div");
          empty.className = "team-member empty";
          empty.textContent = "Drop characters here";
          members.appendChild(empty);
        } else {
          slot.characterIds.forEach(id => {
            const c = state.characters[id];
            if(!c) return;
            const m = document.createElement("div");
            m.className = "team-member";
            m.dataset.charId = id;

            const nameSpan = document.createElement("span");
            nameSpan.textContent = c.firstName + (c.lastName ? " " + c.lastName : "");
            nameSpan.style.cursor = "pointer";
            nameSpan.addEventListener("click", ()=>openModal(id));
            m.appendChild(nameSpan);

            const actions = document.createElement("div");
            actions.className = "member-actions";
            const benchBtn = document.createElement("button");
            benchBtn.className = "small";
            benchBtn.textContent = "Bench";
            benchBtn.addEventListener("click", ()=>{
              removeFromSlot(round.id, slot.id, id);
              saveLocal(); render();
            });
            actions.appendChild(benchBtn);

            attachDraggable(m, { charId:id, from:'slot', roundId:round.id, slotId:slot.id });
            m.style.cursor = 'grab';

            m.appendChild(actions);
            members.appendChild(m);
          });
        }
        card.appendChild(members);
        board.appendChild(card);
      });
    });
  }

  /* ============ Tab switching ============ */
  document.getElementById("tab-rounds").addEventListener("click", ()=>{
    currentView = 'rounds';
    document.getElementById("tab-rounds").classList.add("active");
    document.getElementById("tab-teams").classList.remove("active");
    render();
  });
  document.getElementById("tab-teams").addEventListener("click", ()=>{
    currentView = 'teams';
    document.getElementById("tab-teams").classList.add("active");
    document.getElementById("tab-rounds").classList.remove("active");
    render();
  });

  /* ============ Mobile roster drawer ============ */
  const poolPanel = document.getElementById("pool-panel");
  const poolBackdrop = document.getElementById("pool-backdrop");
  const poolToggle = document.getElementById("pool-toggle");
  const poolClose = document.getElementById("pool-close");
  function openDrawer(){ poolPanel.classList.add("open"); poolBackdrop.classList.add("open"); poolClose.style.display="inline-flex"; }
  function closeDrawer(){ poolPanel.classList.remove("open"); poolBackdrop.classList.remove("open"); }
  poolToggle.addEventListener("click", openDrawer);
  poolBackdrop.addEventListener("click", closeDrawer);
  poolClose.addEventListener("click", closeDrawer);

  /* ============ Create character form ============ */
  document.getElementById("btn-create").addEventListener("click", ()=>{
    const name = document.getElementById("f-name").value.trim();
    if(!name){ alert("First name is required."); return; }
    const surname = document.getElementById("f-surname").value.trim();
    const gender = document.getElementById("f-gender").value.trim();
    const ageRaw = document.getElementById("f-age").value.trim();
    const age = ageRaw === "" ? "" : Number(ageRaw);
    const notes = document.getElementById("f-notes").value;
    createCharacter({firstName:name, lastName:surname, gender, age, notes});
    document.getElementById("f-name").value = "";
    document.getElementById("f-surname").value = "";
    document.getElementById("f-gender").value = "";
    document.getElementById("f-age").value = "";
    document.getElementById("f-notes").value = "";
    saveLocal(); render();
  });

  document.getElementById("btn-add-round").addEventListener("click", addRound);

  /* ============ JSON export/import ============ */
  document.getElementById("btn-export").addEventListener("click", ()=>{
    const blob = new Blob([JSON.stringify(state, null, 2)], {type:"application/json"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `tournament-${new Date().toISOString().slice(0,10)}.json`;
    a.click();
    URL.revokeObjectURL(url);
  });
  document.getElementById("btn-import").addEventListener("click", ()=>{ document.getElementById("file-input").click(); });
  document.getElementById("file-input").addEventListener("change", (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = ()=>{
      try{
        const parsed = JSON.parse(reader.result);
        if(!parsed.characters || !parsed.rounds) throw new Error("Invalid file structure");
        state = migrateState(parsed);
        saveLocal(); render();
      }catch(err){ alert("Could not import file: " + err.message); }
    };
    reader.readAsText(file);
    e.target.value = "";
  });

  /* ============ CSV export/import ============ */
  function csvField(v){
    const s = String(v===undefined||v===null ? "" : v);
    if(/[",\n]/.test(s)) return '"' + s.replace(/"/g,'""') + '"';
    return s;
  }

  function parseCSV(text){
    const rows = [];
    let row = [];
    let cur = "";
    let inQuotes = false;
    for(let i = 0; i < text.length; i++){
      const ch = text[i];
      if(inQuotes){
        if(ch === '"'){
          if(text[i+1] === '"'){ cur += '"'; i++; }
          else inQuotes = false;
        } else cur += ch;
      } else {
        if(ch === '"') inQuotes = true;
        else if(ch === ','){ row.push(cur.trim()); cur = ""; }
        else if(ch === '\n'){ row.push(cur.trim()); rows.push(row); row = []; cur = ""; }
        else if(ch === '\r'){ /* skip */ }
        else cur += ch;
      }
    }
    if(cur.length || row.length){ row.push(cur.trim()); rows.push(row); }
    return rows.filter(r => r.some(cell => cell !== ""));
  }

  document.getElementById("btn-export-csv").addEventListener("click", ()=>{
    const ids = Object.keys(state.characters).sort((a,b)=>{
      const ca=state.characters[a], cb=state.characters[b];
      return ca.firstName.localeCompare(cb.firstName, undefined,{sensitivity:"base"});
    });
    const lines = [["FirstName","LastName","Gender","Age","Notes","EliminatedIn"]];
    ids.forEach(id=>{
      const c = state.characters[id];
      const elim = Object.values(c.eliminatedInRounds||{}).join("; ");
      lines.push([c.firstName, c.lastName || "", c.gender || "", c.age !== "" ? c.age : "", c.notes || "", elim]);
    });
    const csvContent = lines.map(row => row.map(v => csvField(v)).join(",")).join("\r\n");
    const blob = new Blob([csvContent], {type:"text/csv;charset=utf-8;"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `roster-${new Date().toISOString().slice(0,10)}.csv`;
    a.click();
    URL.revokeObjectURL(url);
  });

  document.getElementById("btn-import-csv").addEventListener("click", ()=>{ document.getElementById("csv-input").click(); });
  document.getElementById("csv-input").addEventListener("change", (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = ()=>{
      try{
        const rows = parseCSV(reader.result);
        if(!rows.length) throw new Error("Empty file");
        let start = 0;
        const header = rows[0].map(h => h.toLowerCase().trim());
        if(header.includes("firstname") || header.includes("first name")) start = 1;
        let added = 0, errors = 0;
        for(let i = start; i < rows.length; i++){
          const row = rows[i];
          if(row.length < 1 || !row[0]) continue;
          const firstName = row[0] || "";
          const lastName = row[1] || "";
          const gender = row[2] || "";
          const age = row[3] && row[3] !== "" ? Number(row[3]) : "";
          const notes = row[4] || "";
          if(firstName.trim() === ""){ errors++; continue; }
          createCharacter({
            firstName: firstName.trim(),
            lastName: lastName.trim(),
            gender: gender.trim(),
            age: age,
            notes: notes.trim()
          });
          added++;
        }
        saveLocal(); render();
        alert(`Imported ${added} character(s).${errors > 0 ? ` Skipped ${errors} invalid row(s).` : ""}`);
      }catch(err){ alert("Could not import CSV: " + err.message); }
    };
    reader.readAsText(file);
    e.target.value = "";
  });

  document.getElementById("btn-export-template").addEventListener("click", ()=>{
    const headers = ["FirstName","LastName","Gender","Age","Notes"];
    const sampleRow = ["John","Doe","Male","30","Sample character"];
    const csvContent = headers.join(",") + "\r\n" + sampleRow.join(",");
    const blob = new Blob([csvContent], {type:"text/csv;charset=utf-8;"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `tournament-template.csv`;
    a.click();
    URL.revokeObjectURL(url);
  });

  /* ============ Diagram export ============ */
  document.getElementById("btn-export-diagram").addEventListener("click", exportDiagram);

  function exportDiagram(){
    const colWidth = 250, colGap = 70, leftMargin = 40, topMargin = 60;
    const slotHeaderH = 26, charLineH = 18, slotPad = 10, slotGap = 16;

    const roundLayout = state.rounds.map(round=>{
      let y = topMargin;
      const slots = round.slots.map(slot=>{
        const lines = slot.characterIds.length || 1;
        const hh = slotHeaderH + slotPad*2 + lines*charLineH;
        const rect = { slot, round, y, h:hh };
        y += hh + slotGap;
        return rect;
      });
      return { round, slots, totalH: y - slotGap };
    });

    const maxH = Math.max(topMargin, ...roundLayout.map(r=>r.totalH));
    const svgW = leftMargin*2 + state.rounds.length*colWidth + Math.max(0,state.rounds.length-1)*colGap;
    const svgH = maxH + 40;

    let svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${svgW} ${svgH}" width="${svgW}" height="${svgH}" font-family="Arial, Helvetica, sans-serif">`;
    svg += `<rect x="0" y="0" width="${svgW}" height="${svgH}" fill="#0d0f0d"/>`;

    const rects = [];
    roundLayout.forEach((rl, idx)=>{
      const x = leftMargin + idx*(colWidth+colGap);
      svg += `<text x="${x}" y="${topMargin-16}" fill="#6a9a6a" font-size="16" font-weight="700" filter="url(#glow)">${escapeXml(rl.round.name)}</text>`;
      const roundRectsArr = [];
      rl.slots.forEach(sr=>{
        const y = sr.y, hh = sr.h;
        svg += `<rect x="${x}" y="${y}" width="${colWidth}" height="${hh}" rx="10" fill="#141914" stroke="#2a3a2a"/>`;
        const teamLabel = sr.slot.name && sr.slot.name.trim() ? sr.slot.name : "Unnamed team";
        svg += `<text x="${x+12}" y="${y+18}" fill="#6e8a6e" font-size="12" font-family="monospace">${escapeXml(teamLabel)}</text>`;
        svg += `<line x1="${x}" y1="${y+slotHeaderH}" x2="${x+colWidth}" y2="${y+slotHeaderH}" stroke="#1f2a1f"/>`;
        if(sr.slot.characterIds.length===0){
          svg += `<text x="${x+12}" y="${y+slotHeaderH+slotPad+13}" fill="#2a3a2a" font-size="12" font-style="italic">(empty)</text>`;
        } else {
          sr.slot.characterIds.forEach((charId, ci)=>{
            const c = state.characters[charId];
            const label = c ? c.firstName : "?";
            const eliminated = c && c.eliminatedInRounds && c.eliminatedInRounds[rl.round.id];
            const ty = y + slotHeaderH + slotPad + 13 + ci*charLineH;
            const color = eliminated ? "#c1453c" : "#c8dcc8";
            const decoration = eliminated ? ' text-decoration="line-through"' : "";
            svg += `<text x="${x+12}" y="${ty}" fill="${color}" font-size="13"${decoration}>${escapeXml(label)}</text>`;
          });
        }
        roundRectsArr.push({ x, y, w:colWidth, h:hh, slot:sr.slot });
      });
      rects.push(roundRectsArr);
    });

    svg += `<defs><filter id="glow"><feGaussianBlur stdDeviation="2" result="coloredBlur"/><feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>`;

    rects.forEach(slots=>{
      for(let i=0;i+1<slots.length;i+=2){
        const a=slots[i], b=slots[i+1];
        const x1=a.x+a.w, y1=a.y+a.h/2, x2=b.x+b.w, y2=b.y+b.h/2;
        const bump=20;
        svg += `<path d="M ${x1} ${y1} C ${x1+bump} ${y1} ${x1+bump} ${y2} ${x2} ${y2}" fill="none" stroke="#4a6a4a" stroke-width="1.5" stroke-dasharray="3,4" opacity="0.7"/>`;
      }
    });
    for(let i=0;i<rects.length-1;i++){
      rects[i].forEach(a=>{
        rects[i+1].forEach(b=>{
          const shared = a.slot.characterIds.some(id=>b.slot.characterIds.includes(id));
          if(shared){
            const x1=a.x+a.w, y1=a.y+a.h/2, x2=b.x, y2=b.y+b.h/2;
            const midX=(x1+x2)/2;
            svg += `<path d="M ${x1} ${y1} C ${midX} ${y1} ${midX} ${y2} ${x2} ${y2}" fill="none" stroke="#6a9a6a" stroke-width="2.2" opacity="0.9" filter="url(#glow)"/>`;
          }
        });
      });
    }

    svg += `</svg>`;

    const blob = new Blob([svg], {type:"image/svg+xml"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `tournament-diagram-${new Date().toISOString().slice(0,10)}.svg`;
    a.click();
    URL.revokeObjectURL(url);
  }

  function escapeXml(str){
    return String(str).replace(/[&<>"']/g, s=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[s]));
  }

  /* ============ Init ============ */
  if(!loadLocal()){ state = defaultState(); saveLocal(); }
  render();
})();
</script>
</body>
